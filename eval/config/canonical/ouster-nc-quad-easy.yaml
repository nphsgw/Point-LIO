check_satu: true
common:
  con_frame: false
  con_frame_num: 1
  cut_frame: false
  cut_frame_time_interval: 0.1
  imu_topic: /os_cloud_node/imu
  lid_topic: /os_cloud_node/points
  time_diff_lidar_to_imu: 0.0
filter_size_map: 0.5
filter_size_surf: 0.5
init_map_size: 10
ivox_nearby_type: 6
mapping:
  acc_cov_input: 0.1
  acc_cov_output: 500
  acc_norm: 9.81
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_R:
  - 1
  - 0
  - 0
  - 0
  - 1
  - 0
  - 0
  - 0
  - 1
  extrinsic_T:
  - 0.0
  - 0.0
  - 0.0
  extrinsic_est_en: false
  gravity:
  - 0.0
  - 0.0
  - -9.81
  gravity_init:
  - 0.0
  - 0.0
  - -9.81
  gyr_cov_input: 0.01
  gyr_cov_output: 1000
  imu_en: true
  imu_meas_acc_cov: 0.1
  imu_meas_omg_cov: 0.1
  imu_time_inte: 0.01
  ivox_grid_resolution: 2.0
  lidar_meas_cov: 0.01
  lidar_time_inte: 0.1
  match_s: 81
  plane_thr: 0.1
  satu_acc: 30.0
  satu_gyro: 35
odometry:
  publish_odometry_without_downsample: false
pcd_save:
  interval: -1
  pcd_save_en: false
point_filter_num: 4
preprocess:
  blind: 4.0
  lidar_type: 3
  scan_line: 128
  timestamp_unit: 3
prop_at_freq_of_imu: true
publish:
  path_en: true
  scan_bodyframe_pub_en: false
  scan_publish_en: true
runtime_pos_log_enable: false
space_down_sample: true
use_imu_as_input: false
